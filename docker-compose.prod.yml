# Pinecone 生产部署（含 postgres+redis 全栈）
# 用法：docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:18.4
    container_name: pinecone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pinecone
      POSTGRES_USER: pinecone_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      # postgres 18.4（docker-library/postgres#1259）：数据目录改为 major-version 子目录，
      # 必须单点挂载 /var/lib/postgresql（旧路径 /var/lib/postgresql/data 会被识别为未迁移库而拒绝启动）
      - postgres-data:/var/lib/postgresql
      # 只建角色/权限（01-init.sh）；【建表统一走 prisma migrate deploy】
      # （2026-08-21 起废弃 init 快照 02-schema.sql——旧快照缺 37 张表且双轨漂移。
      #  新库初始化：postgres 健康后，用 pinecone_admin 执行
      #  `npx prisma migrate deploy`（见 DEPLOYMENT.md「Database schema」）。）
      - ./docker/postgres/init-v2:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinecone_admin -d pinecone"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinecone-network

  redis:
    image: redis:7-alpine
    container_name: pinecone-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pinecone-network

  backend:
    # image 与 build 并存：离线分发包直接 load pinecone-backend.tar 后 compose 用固定镜像名，
    # 不依赖目录名（避免 compose 默认镜像名=目录名-backend 触发无源码重建失败）；源码用户加 --build 仍可重建
    # 条件 Go（2026-08-19）：发布必须用不可变 tag（BACKEND_IMAGE_TAG=vX.Y.Z-<sha>，见 scripts/release-images.sh），
    # 禁止以 :latest 作为回滚凭据——latest 仅作滚动指针；回滚 = load 上一版 tar 或重新 build 旧 commit
    image: pinecone-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        # 记录构建来源 commit（回滚/审计时确认版本）
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    labels:
      - "pinecone.commit=${COMMIT_SHA:-unknown}"
    container_name: pinecone-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
      # B4 修复（2026-08-19 上线前全检）：发布 kb-collab WS 端口，生产可达
      - "${KB_COLLAB_PORT:-3002}:3002"
    volumes:
      # Persist uploaded files (容器重启不丢附件)
      # ⚠️ F-9（2026-08-19 全检）：附件鉴权在 /api/workspaces/:wsId/uploads/:id/download，
      # 生产反代【严禁】配置 location /uploads 直出该卷（否则绕过鉴权、可被匿名遍历下载）。
      - ./uploads:/app/uploads
      # I3 协同态持久化（2026-08-18 P0）：y-leveldb 落盘，重启不丢协同编辑
      - ./data/kb-collab:/app/data/kb-collab
      # B4 修复：TLS 证书挂载（HTTPS_CERT_PATH/HTTPS_KEY_PATH 相对 /app 解析）
      - ./certs:/app/certs:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      # B4 修复：kb-collab WS 端口（默认 3002）与 TLS 证书（相对容器 /app 解析）
      KB_COLLAB_PORT: ${KB_COLLAB_PORT:-3002}
      HTTPS_CERT_PATH: ${HTTPS_CERT_PATH:-certs/pinecone.crt}
      HTTPS_KEY_PATH: ${HTTPS_KEY_PATH:-certs/pinecone.key}
      # 最小权限：运行时用 pinecone_app（DML）而非 pinecone_admin（DDL）
      DATABASE_URL: postgresql://pinecone_app:${APP_DB_PASSWORD}@postgres:5432/pinecone
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:6173}
      # ── Cookie 安全（verify2 F-003）：生产走 HTTPS 反代时设 true（Secure cookie）；默认 false 兼容 http 后端 ──
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # ── 注册控制（发布门禁 Fix#2：必须显式转发，否则生产容器内默认 fail-closed=whitelist）──
      # 显式设 open 才开放注册；whitelist=仅白名单邮箱；invite=需邀请码（配合 REGISTRATION_ADMIN_EMAILS）
      REGISTRATION_MODE: ${REGISTRATION_MODE:-}
      # 可管理白名单/邀请码/用户禁用的管理员邮箱（逗号分隔；未配置=管理端全部 403）
      REGISTRATION_ADMIN_EMAILS: ${REGISTRATION_ADMIN_EMAILS:-}
      # ── SMTP（密码重置/to-do 通知邮件；未配置时这些邮件功能不可用，但不影响其他功能）──
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_SECURE: ${EMAIL_SECURE:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pinecone-network

  frontend:
    # image 与 build 并存：离线分发包直接 load pinecone-frontend.tar 后 compose 用固定镜像名
    # 条件 Go（2026-08-19）：发布用不可变 tag（FRONTEND_IMAGE_TAG=vX.Y.Z-<sha>，见 scripts/release-images.sh）
    image: pinecone-frontend:${FRONTEND_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      # NEXT_PUBLIC_* 是 BUILD 时内联进 JS 的，必须通过 build args 传（运行时 environment 不生效）
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3000/api}
        NEXT_PUBLIC_WS_URL: ${WS_URL:-http://localhost:3000/ws}
        # B4 修复：KB 协同 WS 地址（生产须与后端发布端口/TLS 一致，如 wss://host:3002/kb-collab）
        NEXT_PUBLIC_KB_COLLAB_URL: ${KB_COLLAB_URL:-wss://localhost:3002/kb-collab}
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    labels:
      - "pinecone.commit=${COMMIT_SHA:-unknown}"
    container_name: pinecone-frontend
    restart: unless-stopped
    ports:
      # 容器内 `next start` 默认监听 3000（前端 Dockerfile EXPOSE 3000）
      - "${FRONTEND_PORT:-6173}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - pinecone-network

networks:
  pinecone-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
