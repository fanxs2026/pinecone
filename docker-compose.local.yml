# ── Docker 本地演练配置（跳过数据库，直连宿主机开发库）──
# 用法：docker compose -f docker-compose.local.yml up -d --build
# 与 docker-compose.prod.yml 互不影响；生产部署仍用 prod 文件（含 postgres/redis）

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: pinecone-backend-local
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: 3000
      # 直连宿主机开发库（Docker Desktop 的 host.docker.internal 指向宿主机）
      DATABASE_URL: postgresql://pinecone_app:${DB_APP_PASSWORD}@host.docker.internal:5432/pinecone
      # 演练：跳过 prisma db push，不碰开发库结构（要同步 schema 时手动跑）
      SKIP_DB_PUSH: "1"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:6173}
      # 容器内无证书 → 强制 http（本机演练用；正式 https 走 prod compose + 证书挂载）
      HTTPS_ENABLED: "false"
    networks:
      - pinecone-local

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: pinecone-frontend-local
    restart: unless-stopped
    ports:
      # 容器内 `next start` 默认监听 3000
      - "${FRONTEND_PORT:-6173}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3000/api}
    depends_on:
      - backend
    networks:
      - pinecone-local

networks:
  pinecone-local:
    driver: bridge
