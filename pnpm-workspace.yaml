packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  classic-level: false
  esbuild: true
  leveldown: false
  prisma: true
  sharp: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
  - baseline-browser-mapping@2.11.40
  - hono@4.13.23

# 安全 overrides：升级可向后兼容的传递依赖，消除 audit 报告的高危项。
#
# 2026-11-27 第二轮调整（老板要求「尽量升级，但不要删任何东西」）：
# - 原先把 brace-expansion / js-yaml / fast-uri 钉在 1.1.18 / 4.3.1 / 3.1.5，
#   这三个版本本轮已被列进 advisory，统一抬到修复版
# - 新增 prosemirror-view / body-parser / qs / engine.io / @xmldom/xmldom：
#   都在运行时可达（编辑器 XSS、请求体 DoS、WebSocket DoS、SAML XML 解析）
# - multer 被 @nestjs/platform-express 精确锁在 2.1.1（无 caret），升 2.2.0 只能 override；
#   2.1→2.2 是 minor，上传接口需回归确认
# - 不动 @node-saml/node-saml：SAML 属企业版功能，依赖保留
overrides:
  socket.io-parser: '4.2.7'
  brace-expansion: '1.1.21'
  js-yaml: '4.3.2'
  browserslist: '4.29.6'
  source-map-js: '1.2.4'
  mysql2: '3.24.6'
  hono: '4.13.23'
  '@hono/node-server': '1.19.19'
  valibot: '1.5.0'
  baseline-browser-mapping: '2.11.40'
  fast-uri: '3.1.9'
  deepmerge-ts: '8.0.0'
  proxy-addr: '2.0.8'
  prosemirror-view: '1.42.3'
  body-parser: '2.4.0'
  qs: '6.17.1'
  engine.io: '6.6.10'
  multer: '2.5.0'
  '@xmldom/xmldom': '0.8.15'
